/* ---------- BOARD ---------- */
/* Portrait-Flaeche im Seitenverhaeltnis der PPTX (A4), zentriert */
.board{
  position:relative;
  /* moeglichst gross: durch die Hoehe begrenzt (fast volle Viewport-Hoehe),
     sonst durch die Breite. Haelt das A4-Hochformat der Vorlage. */
  width:min(97vw, 68vh);
  aspect-ratio: 6858 / 9906;
  margin:1.5vh auto;
}

.item{
  position:absolute;
  left:var(--x, 50%);
  top:var(--y, 50%);
  z-index:var(--z, 1);
  transform: translate(-50%,-50%) rotate(var(--rot, 0deg));
  border:none;
  background:none;
  padding:0;
  cursor:pointer;
  transition: transform .25s ease, filter .25s ease;
  line-height:0;
}
.item img{
  width:100%;
  height:auto;
  display:block;
  filter: drop-shadow(0 8px 16px rgba(40,35,20,.35));
}
.item:hover, .item:focus-visible{
  transform: translate(-50%,-50%) rotate(var(--rot, 0deg)) scale(1.05);
  z-index:20;
  outline:none;
}
.item:hover img, .item:focus-visible img{
  filter: drop-shadow(0 14px 26px rgba(40,35,20,.45));
}

/* Groessen der einzelnen Objekte (% der Board-Breite) */
.item--envelope { width:44%; }
.item--cassette { width:30%; }
.item--polaroid { width:30%; }
.item--lipp     { width:30%; }
.item--building { width:23%; }
.item--eyes     { width:24%; }
.item--ticket   { width:27%; }

.item-hint{
  position:absolute;
  left:50%; bottom:-1.4em;
  transform:translateX(-50%);
  font-family:'Caveat', cursive;
  font-size:1rem;
  line-height:1.1;
  white-space:nowrap;
  color:var(--maroon);
  opacity:0;
  transition:opacity .2s;
  pointer-events:none;
}
.item:hover .item-hint, .item:focus-visible .item-hint{ opacity:.9; }

/* ---------- MODALS ---------- */
.modal-overlay{
  position:fixed; inset:0;
  background: rgba(30,28,15,.45);
  display:flex; align-items:center; justify-content:center;
  padding:1.2em;
  z-index:100;
}
.modal-overlay[hidden]{ display:none; }

.modal-panel{
  position:relative;
  border-radius:var(--radius);
  box-shadow: 0 20px 48px rgba(0,0,0,.4);
  animation: modal-in .25s cubic-bezier(.6,.1,.3,1);
  max-height:86vh;
  overflow-y:auto;
}
@keyframes modal-in{
  from{ opacity:0; transform: scale(.94); }
  to{ opacity:1; transform: scale(1); }
}

.modal-close{
  position:absolute; top:.5em; right:.6em;
  width:2em; height:2em;
  border:none; border-radius:50%;
  background: rgba(0,0,0,.12);
  color:inherit;
  font-size:1.3rem; line-height:1;
  cursor:pointer;
  z-index:2;
}
.modal-close:hover{ background: rgba(0,0,0,.22); }

/* Info-Modal: olivgruen, halbtransparent, Hintergrund bleibt sichtbar */
.modal-panel--info{
  width:min(92vw, 460px);
  background: rgba(105, 131, 12, 0.86);
  backdrop-filter: blur(3px);
  color: var(--off-yellow);
  padding: 2.2em 1.6em 1.6em;
  display:flex; flex-direction:column; gap:.5em;
}
.modal-panel--info .modal-close{ color:var(--off-yellow); background:rgba(254,253,228,.18); }
.modal-panel--info .modal-close:hover{ background:rgba(254,253,228,.3); }
.modal-stamp{
  align-self:flex-start;
  font-family:'Special Elite', monospace;
  font-size:.65rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  border:1px solid var(--off-yellow);
  border-radius:20px;
  padding:.25em .7em;
  transform:rotate(-3deg);
  margin-bottom:.3em;
}
.modal-body h3{ margin:.4em 0 0; font-size:1.2rem; color:var(--off-yellow); }
.modal-body p{ margin:0; font-size:1rem; line-height:1.4; }
.modal-body p.small{ font-size:.85rem; opacity:.82; }
.pill-link{
  align-self:flex-start;
  margin-top:.4em;
  font-family:'Special Elite', monospace;
  font-size:.8rem;
  color:var(--off-yellow);
  text-decoration:none;
  border-bottom:1px solid var(--off-yellow);
}

/* RSVP-Modal: Postkarte */
.modal-panel--rsvp{
  width:min(94vw, 620px);
  background:var(--off-yellow);
  padding: clamp(1.3em, 4vw, 2.2em);
}
.postcard-header{
  display:flex; justify-content:space-between; align-items:baseline;
  border-bottom:1px dashed rgba(0,0,0,.28);
  padding-bottom:.6em; margin-bottom:1.1em;
}
.postcard-title{
  font-family:'Special Elite', monospace;
  font-size:1rem; letter-spacing:.08em; text-transform:uppercase;
  color:var(--slate-dark);
}
.postcard-stamp{
  font-size:1.3rem; color:var(--maroon);
  border:2px dotted var(--maroon); padding:.1em .3em; transform:rotate(6deg);
}
.attend-toggle{
  border:none; padding:0; margin:0 0 1.2em;
  display:flex; gap:.7em; flex-wrap:wrap; align-items:center;
}
.attend-toggle legend{
  font-family:'Caveat', cursive; font-size:1.3rem; color:var(--maroon);
  margin-bottom:.4em; width:100%;
}
.radio-pill{
  display:flex; align-items:center; gap:.4em; font-size:.95rem;
  border:1px solid var(--slate-dark); border-radius:20px; padding:.4em .9em; cursor:pointer;
}
.radio-pill input{ accent-color: var(--olive); }

.field-grid{ display:grid; grid-template-columns:1fr 1fr; gap:.9em 1.1em; }
.field-wide{ grid-column:1 / -1; }
.field{ display:flex; flex-direction:column; gap:.3em; font-size:.85rem; color:var(--slate-dark); }
.field input, .field select, .field textarea{
  font-family:'Cormorant Garamond', serif; font-size:1rem; padding:.5em .6em;
  border:1px solid rgba(0,0,0,.25); border-radius:2px; background:#fffdf2; color:var(--ink);
}
.field textarea{ resize:vertical; }

.postcard-submit{
  margin-top:1.4em; width:100%; padding:.8em;
  background:var(--olive); color:var(--off-yellow); border:none; border-radius:2px;
  font-family:'Special Elite', monospace; font-size:.9rem; letter-spacing:.05em; cursor:pointer;
  transition: background .2s;
}
.postcard-submit:hover{ background:var(--olive-dark); }
.form-status{
  text-align:center; font-family:'Caveat', cursive; font-size:1.15rem;
  color:var(--slate-dark); min-height:1.5em; margin:.6em 0 0;
}

/* ---------- MOBILE: Collage bleibt (Hochformat passt auf Handys) ---------- */
@media (max-width: 720px){
  .board{
    width:97vw;
    margin:1vh auto;
  }
  /* Hinweistexte auf dem Handy immer sichtbar, damit klar ist: antippbar */
  .item-hint{ opacity:.9; }
}

@media (prefers-reduced-motion: reduce){
  *{ transition-duration:.01ms !important; animation-duration:.01ms !important; }
}

</style>

<!-- ---------- INFO-MODAL (olivgruen, halbtransparent) ---------- -->
<div class="modal-overlay" id="info-overlay" hidden>
  <div class="modal-panel modal-panel--info" role="dialog" aria-modal="true">
    <button class="modal-close" data-close aria-label="Schliessen">&times;</button>
    <span class="modal-stamp" id="info-stamp"></span>
    <div class="modal-body" id="info-body"></div>
  </div>
</div>

<!-- ---------- RSVP-MODAL (Pop-up nach Klick auf den Umschlag) ---------- -->
<div class="modal-overlay" id="rsvp-overlay" hidden>
  <div class="modal-panel modal-panel--rsvp" role="dialog" aria-modal="true" aria-label="Antwortkarte">
    <button class="modal-close" data-close aria-label="Schliessen">&times;</button>
    <form class="postcard" id="rsvp-form">
      <div class="postcard-header">
        <span class="postcard-title">Antwortkarte</span>
        <span class="postcard-stamp">&#9993;</span>
      </div>

      <fieldset class="attend-toggle">
        <legend>Kommt ihr?</legend>
        <label class="radio-pill">
          <input type="radio" name="attending" value="ja" checked required>
          <span>Ja, wir kommen!</span>
        </label>
        <label class="radio-pill">
          <input type="radio" name="attending" value="nein">
          <span>Leider nicht dabei</span>
        </label>
      </fieldset>

      <div class="field-grid" id="rsvp-details">
        <label class="field">
          <span>Name(n)</span>
          <input type="text" name="name" required placeholder="Vorname Nachname">
        </label>
        <label class="field">
          <span>Anzahl Personen</span>
          <input type="number" name="guests" min="1" value="1">
        </label>
        <label class="field">
          <span>Essenswuensche</span>
          <select name="food">
            <option value="alles">Ich esse alles</option>
            <option value="vegetarisch">Vegetarisch</option>
            <option value="vegan">Vegan</option>
            <option value="sonstiges">Sonstiges / Allergien</option>
          </select>
        </label>
        <label class="field">
          <span>Allergien / Anmerkungen</span>
          <input type="text" name="foodNotes" placeholder="optional">
        </label>
        <label class="field">
          <span>Anreise</span>
          <input type="date" name="arrival">
        </label>
        <label class="field">
          <span>Abreise</span>
          <input type="date" name="departure">
        </label>
        <label class="field field-wide">
          <span>Uebernachtung</span>
          <select name="stay">
            <option value="zelt">Zelt</option>
            <option value="van">Van / Camper</option>
            <option value="huette">Huette vor Ort</option>
            <option value="hotel">Hotel in der Naehe</option>
            <option value="keine">Keine Unterkunft noetig</option>
            <option value="sonstiges">Sonstiges</option>
          </select>
        </label>
        <label class="field field-wide">
          <span>Nachricht an uns</span>
          <textarea name="message" rows="3" placeholder="optional"></textarea>
        </label>
      </div>

      <button type="submit" class="postcard-submit">Antwort abschicken</button>
      <p class="form-status" id="form-status" role="status"></p>
    </form>
  </div>
</div>

<!-- Inhalte fuer die Info-Modals -->
<template id="content-us">
  <h3>Schoen, dass ihr da seid</h3>
  <p>Wir freuen uns riesig, mit euch zu feiern. Hier findet ihr nach und nach alle Infos rund um unseren Tag - klickt euch einfach durch die Karten.</p>
</template>
<template id="content-travel">
  <h3>Wie ihr zu uns findet</h3>
  <p>Der naechste Bahnhof ist [Bahnhof], von dort fahren Shuttles ab 14 Uhr. Parkplaetze gibt es direkt am [Ort].</p>
  <p class="small">Adresse: [Strasse Hausnummer, PLZ Ort]</p>
  <a class="pill-link" href="https://maps.google.com/?q=" target="_blank" rel="noopener">Route oeffnen &#8599;</a>
</template>
<template id="content-ceremony">
  <h3>16:00 Uhr - Trauung</h3>
  <p>[Kirche / Location], [Strasse Hausnummer, PLZ Ort]. Bitte seid 15 Minuten vorher da.</p>
  <h3>19:00 Uhr - Dinner</h3>
  <p>Im Anschluss feiern wir im [Venue-Name] weiter - nur zwei Gehminuten entfernt.</p>
</template>
<template id="content-stay">
  <h3>Uebernachten</h3>
  <p>Vor Ort gibt es Stellplaetze fuer Zelt und Van sowie ein paar Huetten. In der Naehe liegt ausserdem das [Hotelname].</p>
  <p class="small">Buchungslinks und Details tragen wir hier bald ein.</p>
</template>
<template id="content-afterparty">
  <h3>Die Nacht gehoert uns</h3>
  <p>Ab 22 Uhr geht's weiter in den Huetten direkt nebenan - Feuerkorb, Musik, gute Gesellschaft.</p>
</template>

<script>
// ---------- CONFIG ----------
// Nach dem Einrichten des Google Sheets hier die Web-App-URL eintragen (siehe README, Schritt 3)
const GOOGLE_SCRIPT_URL = "";

// ---------- Modal-Steuerung ----------
const infoOverlay = document.getElementById('info-overlay');
const infoBody = document.getElementById('info-body');
const infoStamp = document.getElementById('info-stamp');
const rsvpOverlay = document.getElementById('rsvp-overlay');

const stamps = {
  us: "Willkommen",
  travel: "Anreise",
  ceremony: "Zeremonie & Dinner",
  stay: "Uebernachten",
  afterparty: "Afterparty"
};

function openInfo(key){
  const tpl = document.getElementById(`content-${key}`);
  if (!tpl) return;
  infoBody.innerHTML = '';
  infoBody.appendChild(tpl.content.cloneNode(true));
  infoStamp.textContent = stamps[key] || '';
  infoOverlay.hidden = false;
}

function openRsvp(){
  rsvpOverlay.hidden = false;
}

function closeAll(){
  infoOverlay.hidden = true;
  rsvpOverlay.hidden = true;
}

// Klick auf ein Objekt
document.querySelectorAll('[data-open]').forEach(el => {
  el.addEventListener('click', () => {
    const key = el.dataset.open;
    if (key === 'rsvp') openRsvp();
    else openInfo(key);
  });
});

// Schliessen: X-Button, Klick auf Overlay, Escape
document.querySelectorAll('[data-close]').forEach(btn => btn.addEventListener('click', closeAll));
[infoOverlay, rsvpOverlay].forEach(ov => {
  ov.addEventListener('click', (e) => { if (e.target === ov) closeAll(); });
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeAll();
});

// ---------- RSVP: Ja/Nein steuert sichtbare Felder ----------
const detailFields = document.getElementById('rsvp-details');
function updateDetailVisibility(){
  const attending = document.querySelector('input[name="attending"]:checked').value;
  detailFields.style.display = attending === 'ja' ? 'grid' : 'none';
}
document.querySelectorAll('input[name="attending"]').forEach(r =>
  r.addEventListener('change', updateDetailVisibility));
updateDetailVisibility();

// ---------- RSVP absenden ----------
const form = document.getElementById('rsvp-form');
const status = document.getElementById('form-status');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form).entries());
  data.timestamp = new Date().toISOString();

  if (!GOOGLE_SCRIPT_URL) {
    status.textContent = "Formular ist noch nicht verbunden (siehe README, Schritt 3).";
    console.log("RSVP-Daten (lokal, noch nicht gesendet):", data);
    return;
  }

  status.textContent = "Wird gesendet ...";
  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify(data)
    });
    status.textContent = "Danke! Eure Antwort ist bei uns angekommen.";
    form.reset();
    updateDetailVisibility();
  } catch (err) {
    console.error(err);
    status.textContent = "Hm, das hat nicht geklappt. Schreibt uns gern direkt eine Nachricht.";
  }
});

</script>
</body>
</html>
