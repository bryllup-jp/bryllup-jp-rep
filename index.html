<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: ohne das haelt iOS den Seiteninhalt aus den Safe Areas
     (hinter Statusleiste und Home-Indikator) heraus und faerbt diese Raender
     selbst einfarbig ein - das Streifenmuster kam dort nie an. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f3ecc9">
<title>Josi &amp; Philipp — Bryllup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<!-- ?v= erhoeht, wenn style.css/script.js sich aendern: Cloudflare und die
     Browser cachen die Dateien sonst und liefern tagelang die alte Version. -->
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<main class="board" id="board">

  <!-- Umschlag „you're invited" -> oeffnet das RSVP-Formular als Pop-up -->
  <button class="item item--envelope" style="--x:51%; --y:20%; --rot:-1deg; --z:6;"
          data-open="rsvp" aria-haspopup="dialog">
    <img src="images/envelope.png" alt="Einladung - hier antworten">
  </button>

  <!-- Kassette „wedding playlist" -> Link zur Playlist -->
  <a class="item item--cassette" style="--x:18%; --y:77%; --rot:-3deg; --z:1;"
     href="https://open.spotify.com/playlist/1BfauCCBEuvNoPWJjcM9NI?si=3hm-3K9NQLK1VwX0_M549g&amp;utm_source=copy-link&amp;pi=BdQbbfFJRHais" target="_blank" rel="noopener">
    <img src="images/cassette.png" alt="Zur Hochzeits-Playlist">
  </a>

  <!-- Polaroid -> Wir / Willkommen -->
  <button class="item item--polaroid" style="--x:46%; --y:50%; --rot:1deg; --z:7;"
          data-open="us" aria-haspopup="dialog">
    <img src="images/polaroid.png" alt="Welcome">
  </button>

  <!-- LIPP-Flyer -> Zeremonie & Dinner -->
  <button class="item item--lipp" style="--x:82%; --y:46%; --rot:2deg; --z:4;"
          data-open="ceremony" aria-haspopup="dialog">
    <img src="images/lipp.png" alt="Zeremonie und Dinner">
  </button>

  <!-- Gebaeude -> Unterkuenfte -->
  <button class="item item--building" style="--x:50%; --y:86%; --rot:-2deg; --z:2;"
          data-open="stay" aria-haspopup="dialog">
    <img src="images/building.png" alt="Unterkuenfte">
  </button>

  <!-- Play/Pause -> "Trolltog (March of the Trolls)" von Edvard Grieg -->
  <button class="item item--troll" style="--x:100%; --y:101%; --rot:0deg; --z:5;"
          id="troll-audio-btn" aria-pressed="false" aria-label="Musik abspielen: March of the Trolls">
    <svg class="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
    <svg class="icon-pause" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
  <audio id="troll-audio" src="audio/march-of-the-trolls.mp3" preload="none"></audio>

  <!-- Silber-Dose -> Gifts & Presents -->
  <button class="item item--eyes" style="--x:80%; --y:69%; --rot:3deg; --z:1;"
          data-open="afterparty" aria-haspopup="dialog">
    <img src="images/eyes.png" alt="Gifts & Presents">
  </button>

  <!-- Foto -> About Røros -->
  <button class="item item--roros" style="--x:14%; --y:46%; --rot:-2deg; --z:3;"
          data-open="roros" aria-haspopup="dialog">
    <img src="images/roros.jpg" alt="About Røros">
  </button>

  <!-- Ticket -> Anreise -->
  <button class="item item--ticket" style="--x:78%; --y:86%; --rot:2deg; --z:1;"
          data-open="travel" aria-haspopup="dialog">
    <img src="images/ticket.png" alt="Directions">
  </button>

</main>

<!-- ---------- INFO-MODAL (olivgruen, halbtransparent) ---------- -->
<div class="modal-overlay" id="info-overlay" hidden>
  <div class="modal-panel modal-panel--info" role="dialog" aria-modal="true">
    <button class="modal-close" data-close aria-label="Schliessen">&times;</button>
    <span class="modal-stamp" id="info-stamp"></span>
    <div class="modal-body" id="info-body"></div>
  </div>
</div>

<!-- ---------- RSVP-MODAL (Pop-up nach Klick auf den Umschlag) ---------- -->
<div class="modal-overlay" id="rsvp-overlay" hidden>
  <div class="modal-panel modal-panel--rsvp" role="dialog" aria-modal="true" aria-label="RSVP form">
    <button class="modal-close" data-close aria-label="Close">&times;</button>
    <form class="postcard" id="rsvp-form">
      <div class="postcard-header">
        <span class="postcard-title">RSVP</span>
        <span class="postcard-stamp">&#9993;</span>
      </div>

      <fieldset class="attend-toggle">
        <legend>Will you be joining us?</legend>
        <label class="radio-pill">
          <input type="radio" name="attending" value="yes" checked required>
          <span>Yes, I will come!</span>
        </label>
        <label class="radio-pill">
          <input type="radio" name="attending" value="no">
          <span>Unfortunately, I can't make it</span>
        </label>
      </fieldset>

      <div class="field-grid">
        <label class="field">
          <span>First name</span>
          <input type="text" name="firstName" required placeholder="First name">
        </label>
        <label class="field">
          <span>Surname</span>
          <input type="text" name="lastName" required placeholder="Surname">
        </label>
        <label class="field field-wide">
          <span>Email address</span>
          <input type="email" name="email" required placeholder="you@example.com">
        </label>
      </div>

      <div class="field-grid" id="rsvp-details">
        <label class="field">
          <span>Dietary preference</span>
          <select name="food" required>
            <option value="" disabled selected>Choose one</option>
            <option value="everything">I eat everything</option>
            <option value="vegetarian">Vegetarian</option>
            <option value="vegan">Vegan</option>
          </select>
        </label>
        <label class="field">
          <span>Allergies / notes</span>
          <input type="text" name="foodNotes" placeholder="optional">
        </label>
        <fieldset class="attend-toggle field-wide">
          <legend>I will join for the:</legend>
          <label class="radio-pill">
            <input type="checkbox" name="events" value="rehearsal-dinner">
            <span>Rehearsal Dinner (02.07.)</span>
          </label>
          <label class="radio-pill">
            <input type="checkbox" name="events" value="wedding-dinner">
            <span>Wedding Dinner (03.07.)</span>
          </label>
          <label class="radio-pill">
            <input type="checkbox" name="events" value="sunday-picnic">
            <span>Sunday Picnic (04.07.)</span>
          </label>
        </fieldset>

        <fieldset class="attend-toggle field-wide">
          <legend>I will bring a car:</legend>
          <label class="radio-pill">
            <input type="radio" name="car" value="yes">
            <span>Yes</span>
          </label>
          <label class="radio-pill">
            <input type="radio" name="car" value="no">
            <span>No</span>
          </label>
        </fieldset>
      </div>

      <label class="field">
        <span>Message to us</span>
        <textarea name="message" rows="3" placeholder="Anything else you'd like to tell us?"></textarea>
      </label>

      <button type="submit" class="postcard-submit">Send RSVP</button>
      <p class="form-status" id="form-status" role="status"></p>
    </form>
  </div>
</div>

<!-- Inhalte fuer die Info-Modals -->
<template id="content-us">
  <h3>Hello there :)</h3>
  <p>You are invited to our wedding in Norway on the 3rd of July 2027.</p>
  <p style="margin-top:.6em;">You will find all the information for the wedding on this website - just click on the cards.</p>
  <p style="margin-top:.6em;">Make sure to fill out the RSVP.</p>
  <p style="margin-top:.9em;">Best Josi and Philipp</p>
</template>
<template id="content-travel">
  <h3>How to get there</h3>

  <h3>By train</h3>
  <p>Røros has a train station - you can reach it from <a class="pill-link" href="https://maps.app.goo.gl/bZhLhcpCuGEvcPis5" target="_blank" rel="noopener">Oslo train station <svg class="icon-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a> or <a class="pill-link" href="https://maps.app.goo.gl/tkhj47NVG5HbTFRn8" target="_blank" rel="noopener">Oslo airport (Gardermoen) <svg class="icon-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>.</p>
  <p style="margin-top:.6em;">For people traveling from Dresden, Berlin or Hamburg, there is a daily <a class="pill-link" href="https://www.snalltaget.se/de/zug-nach-oslo?gad_source=1&amp;gad_campaignid=15389243990&amp;gclid=CjwKCAjwiL7VBhA-EiwAhZi9ENWJPPvnT0s3mH-bt6wTfJD-Q-hczcBGT3C2BLc07eL9yTljftvKeRoCkE4QAvD_BwE" target="_blank" rel="noopener">night train <svg class="icon-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a> to Göteborg with a scheduled connection to Oslo.</p>

  <h3>By plane</h3>
  <p>Røros has an airport - you can reach it from Oslo airport. DAT has up to two connections per day: <a class="pill-link" href="https://book.dat.dk/" target="_blank" rel="noopener">book.dat.dk <svg class="icon-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a> (not yet available for July) - around 40-50€</p>
  <p style="margin-top:.6em;">or fly to Trondheim and then take the <a class="pill-link" href="https://maps.app.goo.gl/zGrzTHEcDqHCahzZA" target="_blank" rel="noopener">bus/train <svg class="icon-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a> - we have never tried this option though</p>

  <h3>By car from Germany</h3>
  <p>In the past, we took the car and the ferry from Hirtshals to Kristiansand - very beautiful - reach out if you need a place to sleep on the way, e.g. in Oslo.</p>
  <p class="small">Other options: Ferry from Kiel or the Øresund bridge.</p>
</template>

  <h3>Huts</h3>
  <p>There are several huts in the area. We recommend coordinating and booking them in groups. You can find them on <a class="pill-link" href="https://www.airbnb.de/s/Roros--R%C3%B8ros--Norwegen/homes?refinement_paths%5B%5D=%2Fhomes&amp;place_id=ChIJO4MWCt1kbEYRqx0BCZWD67E&amp;location_bb=QnpM5EE2K7hCekogQTYgqw%3D%3D&amp;acp_id=t-g-ChIJO4MWCt1kbEYRqx0BCZWD67E&amp;date_picker_type=calendar&amp;checkin=2027-07-01&amp;checkout=2027-07-05&amp;search_type=autocomplete_click" target="_blank" rel="noopener">AirBnB <svg class="icon-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a> or on the Norwegian site <a class="pill-link" href="https://www.finn.no/reise/feriehus-hytteutleie/resultat/?lat_sw=62.10268&amp;lng_sw=10.599694&amp;lat_ne=62.721755&amp;lng_ne=12.342798&amp;nrFUSAds=2&amp;country=Norge&amp;city=R%C3%B8ros&amp;no_of_bedrooms_from=0&amp;no_of_beds_from=0&amp;booking_from=2027-07-01&amp;booking_to=2027-07-05" target="_blank" rel="noopener">Finn.no <svg class="icon-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>.</p>

  <h3>Hotels</h3>
  <p>Most hotels are located directly in <a class="pill-link" href="https://www.booking.com/searchresults.de.html?ss=R%C3%B8ros&amp;ssne=R%C3%B8ros&amp;ssne_untouched=R%C3%B8ros&amp;efdco=1&amp;label=roros-v_uaFP7gs8oSq75_Vb1dFAS438072720361%3Apl%3Ata%3Ap1%3Ap2%3Aac%3Aap%3Aneg%3Afi%3Atikwd-350717157323%3Alp9043095%3Ali%3Adec%3Adm%3Appccp%3DUmFuZG9tSVYkc2RlIyh9YcLgEXIAJSu2xZLVMoesqNk&amp;aid=1610679&amp;lang=de&amp;sb=1&amp;src_elem=sb&amp;src=city&amp;dest_id=-276049&amp;dest_type=city&amp;checkin=2027-07-01&amp;checkout=2027-07-05&amp;group_adults=2&amp;no_rooms=1&amp;group_children=0&amp;sb_lp=1" target="_blank" rel="noopener">Røros <svg class="icon-arrow" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 17L17 7M9 7h8v8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></a>.</p>

  <p style="margin-top:.6em;">Anyone who still wants to give something: we'd put it toward that support fund, so everyone can be there.</p>

<template id="content-roros">
  <h3>A little mountain town</h3>
  <p>Røros is a former copper-mining town from the 1600s, and a UNESCO World Heritage site. It consists of many traditional wooden houses and the church (our church) up on the hill (Bergstadens Ziir), which you see on the picture.</p>
  <p style="margin-top:.6em;">We will have a walk through the old town on Saturday, but it is very lovely to walk around, visit the mining museum (Smelthytta), and the market square with a couple of cafés and shops.</p>
  <p style="margin-top:.6em;">If you have extra days, the surrounding area is great for hiking, fishing and bathing.</p>
</template>
